[develop]
script_dir=$base/lib/robot_car_web
[install]
install_scripts=$base/lib/robot_car_web
[metadata]
name = robot_car_web
version = 0.0.1

[options]
packages = find:
install_requires =
  setuptools

[options.package_data]
robot_car_web =
  templates/*.html
  templates/partials/*.html
  static/css/*.css
  static/js/*.js

[options.entry_points]
console_scripts =
  web_server = robot_car_web.web_server_node:main

[options.data_files]
share/ament_index/resource_index/packages =
  resource/robot_car_web
share/robot_car_web =
  package.xml

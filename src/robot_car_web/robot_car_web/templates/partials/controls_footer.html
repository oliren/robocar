<div class="inds">
  <span>Linear&nbsp; <span class="ind-val" data-ind="linear"> 0.00</span> m/s</span>
  <span>Angular <span class="ind-val" data-ind="angular"> 0.00</span> r/s</span>
</div>

<div class="spd">
  <div class="spd-row">
    <span class="spd-name">Speed</span>
    <span class="spd-val">50%</span>
  </div>
  <input class="spd-range" type="range" min="10" max="100" value="50">
</div>

<div class="estop">
  <button class="estop-btn">⛔ EMERGENCY STOP</button>
</div>
